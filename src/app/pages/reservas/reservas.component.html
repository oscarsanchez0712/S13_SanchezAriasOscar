<div class="encabezado-pagina">
  <div>
    <h1>Reservas</h1>
    <p>Control de ingresos, salidas y estado de cada reserva.</p>
  </div>
  <span class="total">{{ reservas.length }} registros</span>
</div>

<div class="tabla-contenedor">
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Huésped</th>
        <th>Habitación</th>
        <th>Check-in</th>
        <th>Check-out</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (r of reservas; track r.codigo) {
        <tr>
          <td>{{ r.codigo }}</td>
          <td>{{ r.huesped }}</td>
          <td>{{ r.habitacion }}</td>
          <td>{{ r.ingreso }}</td>
          <td>{{ r.salida }}</td>
          <td><span [class]="'badge ' + r.estado.toLowerCase()">{{ r.estado }}</span></td>
        </tr>
      }
    </tbody>
  </table>
</div>
