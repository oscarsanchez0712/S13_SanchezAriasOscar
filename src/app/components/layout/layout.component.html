<div class="dashboard">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">HV</div>
      <div>
        <h2>Hotel Valle Real</h2>
        <span>Sistema hotelero</span>
      </div>
    </div>

    <div class="menu-label">MENÚ PRINCIPAL</div>

    <nav class="menu">

      <a routerLink="/inicio"
         routerLinkActive="activo"
         [routerLinkActiveOptions]="{ exact: true }">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
        Inicio
      </a>

      <a routerLink="/habitaciones"
         routerLinkActive="activo">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20v-9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9"/>
          <path d="M3 16h18"/>
          <path d="M7 9V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2"/>
        </svg>
        Habitaciones
      </a>

      <a routerLink="/huespedes"
         routerLinkActive="activo">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/>
          <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/>
          <path d="M18 14.3c2.2.6 3.5 2.4 3.5 5.7"/>
        </svg>
        Huéspedes
      </a>

      <a routerLink="/reservas"
         routerLinkActive="activo">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="2"/>
          <path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
        </svg>
        Reservas
      </a>

    </nav>

    <button class="btn-logout" type="button" (click)="cerrarSesion()">
      Cerrar sesión
    </button>

    <div class="sidebar-footer">
      <span class="estado"></span>
      Sistema de Hotel
      <small>Versión demostrativa</small>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <span class="topbar-label">GESTIÓN HOTELERA</span>
        <h2>Panel de administración del hotel</h2>
      </div>

      <div class="usuario">
        <div class="avatar">AD</div>
        <div>
          <strong>{{ usuario?.nombre }}</strong>
          <small>{{ usuario?.correo }}</small>
        </div>
      </div>
    </header>

    <section class="contenido">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
